# Sourced from github.com/polarpoint-io/platform-agent-stack argocd/non-prod.yaml
#
# Schema matches releases/templates/children-applications.yaml: when
# chart.path is set the source is treated as a git repo at that path.
# The chart lives under charts/platform-agent-stack/ (not repo root -
# root also holds bridge/, the custom MCP bridge service and its own
# Dockerfile/CI - see that repo's bridge/README.md).
chart:
  name: platform-agent-stack
  url: git@github.com:polarpoint-io/platform-agent-stack.git
  path: charts/platform-agent-stack
  targetRevision: main
  namespace: agents

labels:
  service: tooling
  app: platform-agent-stack

values: |
  itsmProvider: freshservice
  llmProvider: anthropic

  # image.repository/tag intentionally not overridden here - the chart's
  # own values.yaml points at ghcr.io/polarpoint-io/platform-agent-bridge,
  # built by this repo's own CI. Bump the chart default, not here, when
  # a new image is published.

  externalSecrets:
    enabled: true
    secretStoreRef:
      name: cluster-secrets-store
      kind: ClusterSecretStore
