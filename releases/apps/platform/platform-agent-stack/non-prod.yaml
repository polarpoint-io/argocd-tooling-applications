# Sourced from github.com/polarpoint-io/platform-agent-stack argocd/non-prod.yaml
#
# Schema matches releases/templates/children-applications.yaml: when
# chart.path is set the source is treated as a git repo at that path.
# This repo IS the chart — Chart.yaml sits at the root so .Files.Get can
# read swarm/, policy/ and itsm-providers/.
#
# Sync order matters: this chart publishes the merged .mcp.json ConfigMap
# that ruflo-bridge mounts, so this Application must be healthy before the
# ruflo-bridge pod can start.
chart:
  name: platform-agent-stack
  url: git@github.com:polarpoint-io/platform-agent-stack.git
  path: .
  targetRevision: main
  namespace: agents

labels:
  service: tooling
  app: platform-agent-stack

values: |
  itsmProvider: freshservice
  llmProvider: modelplane

  image:
    tag: "3.30.2"

  bridge:
    # Verified by rendering ruflo-bridge locally with its real ArgoCD
    # release name (`helm template ruflo-bridge-non-prod ./chart`):
    # fullname is "<release>-ruflo-bridge", NOT the chart's own default
    # ("ruflo-bridge") which assumes a release named exactly "ruflo-bridge".
    # Update this if the ruflo-bridge Application is ever renamed.
    serviceName: ruflo-bridge-non-prod-ruflo-bridge
    port: 3000

  externalSecrets:
    enabled: true
    secretStoreRef:
      name: cluster-secrets-store
      kind: ClusterSecretStore

  state:
    # Populated by mongostate-crossplane's claim once that's wired up.
    # Deployment's secretKeyRef for MONGO_URI is optional:true, so the
    # swarm starts fine without it - just without persistent state.
    connectionSecret: agent-swarm-state
