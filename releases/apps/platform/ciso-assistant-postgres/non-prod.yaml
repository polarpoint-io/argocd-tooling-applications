chart:
  name: postgresql
  url: https://charts.bitnami.com/bitnami
  targetRevision: "15.5.28"
  namespace: ciso-assistant

labels:
  service: tooling
  app: ciso-assistant

# Dedicated Postgres for CISO Assistant (same bitnami/postgresql pattern already used by
# backstage, postiz, and toolhive-registry-postgres in this org - the chart's own bundled
# postgresql subchart is deprecated upstream).
values: |
  fullnameOverride: ciso-assistant-postgres
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: ciso-assistant
    database: ciso-assistant
    existingSecret: ciso-assistant-db
  primary:
    persistence:
      size: 5Gi
