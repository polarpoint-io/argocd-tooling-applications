# TLS termination for the tailscale L4 device 'grc' -> ciso-assistant backend/frontend.
# Mirrors upstream's own Caddy routing (backend /api/*, everything else -> frontend),
# just with cert-manager's cert instead of Caddy's internal self-signed one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grc-tls-proxy
  namespace: ciso-assistant
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8443 ssl;
        server_name {{ .Values.host }};
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        client_max_body_size 50m;

        location /api/ {
          proxy_pass http://{{ .Values.backendService }}:80;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host $host;
          proxy_read_timeout 3600;
        }

        location / {
          proxy_pass http://{{ .Values.frontendService }}:80;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_http_version 1.1;
          proxy_read_timeout 3600;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grc-tls-proxy
  namespace: ciso-assistant
spec:
  replicas: 1
  selector:
    matchLabels: {app: grc-tls-proxy}
  template:
    metadata:
      labels: {app: grc-tls-proxy}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 8443}]
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: grc-tls-proxy}
        - name: tls
          secret: {secretName: grc-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: grc
  namespace: ciso-assistant
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: grc
spec:
  selector: {app: grc-tls-proxy}
  ports:
    - {name: https, port: 443, targetPort: 8443}
